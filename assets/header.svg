<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Rabi Raj Yadav, software engineer and AI instructor at Nepal Telecom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#101a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b2538" stroke-width="1"/>
    </pattern>
    <style>
      .name{font:700 52px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#e6ebf5;letter-spacing:-1px}
      .role{font:500 20px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#93a0b8}
      .mono{font:500 16px 'JetBrains Mono',Consolas,'Courier New',monospace;fill:#2dd4bf}
      .dim{fill:#5d6b85}
      .link{stroke:#2a3a55;stroke-width:1.6}
      .node{fill:#0b0f17;stroke:#2dd4bf;stroke-width:2}
      .hub{fill:#2dd4bf}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .ring{animation:ripple 3s ease-out infinite;transform-origin:930px 150px}
      .ring.r2{animation-delay:1s}.ring.r3{animation-delay:2s}
      @keyframes blink{50%{opacity:0}}
      @keyframes ripple{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.8);opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- network: a central exchange linked to edge nodes -->
  <g>
    <path class="link" d="M930 150L780 70M930 150L800 230M930 150L1080 60M930 150L1110 200M930 150L1010 265M780 70L1080 60M800 230L1010 265M1080 60L1110 200"/>
    <circle class="ring" cx="930" cy="150" r="40" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle class="ring r2" cx="930" cy="150" r="40" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle class="ring r3" cx="930" cy="150" r="40" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle class="node" cx="780" cy="70" r="8"/>
    <circle class="node" cx="800" cy="230" r="8"/>
    <circle class="node" cx="1080" cy="60" r="8"/>
    <circle class="node" cx="1110" cy="200" r="8"/>
    <circle class="node" cx="1010" cy="265" r="7"/>
    <circle class="hub" cx="930" cy="150" r="13"/>
    <circle cx="930" cy="150" r="5" fill="#0b0f17"/>

    <!-- packets travelling between nodes -->
    <circle r="4" fill="#f59e0b"><animateMotion dur="2.6s" repeatCount="indefinite" path="M780 70L930 150"/></circle>
    <circle r="4" fill="#2dd4bf"><animateMotion dur="3.1s" repeatCount="indefinite" path="M930 150L1080 60"/></circle>
    <circle r="4" fill="#f59e0b"><animateMotion dur="2.2s" repeatCount="indefinite" path="M1110 200L930 150"/></circle>
    <circle r="4" fill="#2dd4bf"><animateMotion dur="3.4s" repeatCount="indefinite" path="M930 150L800 230"/></circle>
    <circle r="3.5" fill="#f59e0b"><animateMotion dur="2.8s" repeatCount="indefinite" path="M1010 265L930 150"/></circle>
  </g>

  <!-- identity -->
  <text x="64" y="92" class="mono"><tspan class="dim">~/nepal-telecom $</tspan> whoami</text>
  <text x="62" y="160" class="name">Rabi Raj Yadav</text>
  <text x="64" y="198" class="role">Software Engineer · AI Instructor · Software &amp; Security Wing, NTC</text>
  <text x="64" y="246" class="mono">go · microservices · rag · ai agents · teaching<tspan class="cursor"> ▌</tspan></text>
</svg>
